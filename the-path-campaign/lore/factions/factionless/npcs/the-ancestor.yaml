name: The Ancestor
faction: factionless
role: The Absent One
location: Ascended. Not found on any location of the Path — his traces remain in the Eisenwald and in the sockets that held his runes.

appearance:
  - Tall and gaunt, with a bat-like head — pale blue skin, a short fanged snout, red eyes, and long pointed ears
  - Long white hair braided with gold
  - A deep red robe embroidered in gold, with a high black collar and rubies set in his rings and armbands
  - Clawed hands, held clasped in front of him

the_twist: |
  The tribe was his herd. It was a war tribe, and he gave it wealth and power. When his ascension needed the Fehu rune, he told the tribe he was going to conduct a ritual, led half of them into the mist, to a stone in the swamp, and slaughtered them on it. Their blood made the rune, and it is still in the stone.

  Seven of his inner circle survived and went on with him. At the ascension they bore the rune on their bodies and gave themselves willingly. They were the last part of the price. The ritual did not kill them. It took what they were and left beasts — werecats that still roam the Eisenwald.

  The tribe that stayed behind never learned any of it. Everyone who could have told them either died on the stone or was lost to the beast in the iron forest. All they knew was that he left with half of them for a ritual, and none of them came back. The split was a wound, and the story became a secret — passed on by word of mouth, never written down. It kept the gifts and the leader who went into the mist, and lost everything after that.

theme: |
  The Power Fantasy. The Ancestor is proof that it can be done. He wanted immortality and power and got both. Every step he took is open to the players too: the Fate rune can make a character a vampire, and the ascension ritual can make one a god. Nothing about the path is hidden from them except its price.

  The question he puts to the party is not whether they could become what he became, but whether they would. He paid with a tribe that trusted him and seven people who loved him enough to die for it. A party that follows his path has to decide who their tribe is, and who their seven are.

wants:
  - Nothing from the players. What he wanted — immortality and power — he already has.

offers:
  - Nothing directly. What he left behind is the path itself — the runes, the sites where they were made, and the proof that it can be walked to the end.

gm_notes:
  - He never appears in play. Everything the players learn about him comes from what he left behind — the runes, the sites, and the gap in the tribe's legend.
  - Vampires are the end point of hemomancy. The Archon of Mercy and Croa are both on the same road, at earlier stages. The Archon's blue skin and pointed ears are the beginning of what the Ancestor became.
  - He made himself a vampire with the Fate rune (Perthro) before he ever came to the tribe. He arrived as an outsider, already a vampire, already far along the road of hemomancy. The rune is not the only way to that end — it is one answer to the question hemomancy asks. The Archon and Croa are looking for others.
  - The tribe was catfolk. The werecats the seven became have bred since; the Eisenwald is full of them now. Nothing of who the seven were is left — they and their young are feral.
  - The tribe's legends are vague about him. They keep his features — what he looked like — and little else.
  - The sky was one of the fields he studied. The tribe's star-lore is copied from his research; they kept the practice without understanding what he was looking for.
  - The Eisenwald's sky is frozen at the moment of his ascension — a particular constellation of planets and a meteor shower, held in place. The mist holds the moment something arrived in it, in time and in space.
  - The tribe that stayed behind saw that meteor shower after the others had vanished. Some took it as a sign that the souls of the lost were drifting up to heaven together. It was the ascension they were watching. Their legend does not say where the shower stood; only old records from outside the tribe place it over the mist.
  - The blood held in the grooves of The Reeds' blood stone is his tribe's. Croa has been drawing on it for years without knowing whose it is.
  - The Eisenwald turned to iron when he ascended. His small runes were taken from the Iron Altar's slots afterwards, each still holding 2 charges; who took them is left open. One — Inheritance (Othala) — is still in its slot. See the Eisenwald location.
  - His path is open to the players. The Fate rune can make a character a vampire, and the ascension ritual can make one a god. Do not steer them toward or away from it — let the price speak for itself.
