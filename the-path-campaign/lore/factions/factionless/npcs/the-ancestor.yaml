name: The Ancestor
faction: factionless
role: The Absent One
location: Ascended. Not found on any location of the Path — his traces remain in the Eisenwald and in the sockets that held his runes.

appearance:
  - Tall and gaunt, with a bat-like head — pale blue skin, a short fanged snout, red eyes, and long pointed ears
  - Long white hair braided with gold
  - A deep red robe embroidered in gold, with a high black collar and rubies set in his rings and armbands
  - Clawed hands, held clasped in front of him

the_twist: |
  The tribe was his herd. It was a war tribe, and he gave it wealth and power. When his ascension needed the Fehu rune, he led a large part of the tribe into the mist, to a stone in the swamp, and slaughtered them on it. Their blood made the rune, and it is still in the stone.

  Seven of his inner circle survived and went on with him. At the ascension they bore the rune on their bodies and gave themselves willingly. They were the last part of the price.

  The tribe that stayed behind never learned any of it. Everyone who could have told them died either on the stone or in the iron forest. The stories kept the gifts and the leader who went into the mist, and lost everything after that.

theme: |
  The Power Fantasy. The Ancestor is proof that it can be done. He wanted immortality and power and got both. Every step he took is open to the players too: the Fate rune can make a character a vampire, and the ascension ritual can make one a god. Nothing about the path is hidden from them except its price.

  The question he puts to the party is not whether they could become what he became, but whether they would. He paid with a tribe that trusted him and seven people who loved him enough to die for it. A party that follows his path has to decide who their tribe is, and who their seven are.

wants:
  - Nothing from the players. What he wanted — immortality and power — he already has.

offers:
  - Nothing directly. What he left behind is the path itself — the runes, the sites where they were made, and the proof that it can be walked to the end.

gm_notes:
  - He never appears in play. Everything the players learn about him comes from what he left behind — the runes, the sites, and the gap in the tribe's legend.
  - Vampires are the end point of hemomancy. The Archon of Mercy and Croa are both on the same road, at earlier stages. The Archon's blue skin and pointed ears are the beginning of what the Ancestor became.
  - The blood held in the grooves of The Reeds' blood stone is his tribe's. Croa has been drawing on it for years without knowing whose it is.
  - The Eisenwald turned to iron when he ascended. The other runes were taken from the temple's sockets afterwards; who took them is left open. One small rune is still in its socket.
  - His path is open to the players. The Fate rune can make a character a vampire, and the ascension ritual can make one a god. Do not steer them toward or away from it — let the price speak for itself.
