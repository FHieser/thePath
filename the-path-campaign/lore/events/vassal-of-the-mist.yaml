featureQuestions:
  - What did the party decide had happened, in the time before the vassal came back?
  - How does the vassal explain themselves, and how much do they leave out?
  - Who notices the Ephemeral trait first, and what do they do about it?
  - If the task points at someone in the party, when does that come out?
  - What would a second death, and a second offer, mean for this character?
