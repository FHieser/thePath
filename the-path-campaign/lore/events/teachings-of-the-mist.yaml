featureQuestions:
  - What did the party expect the teaching to be, and how far off were they?
  - Who refuses, and what do they make of the ones who accept?
  - What does a character three teachings deep notice about themselves that the others have not?
  - Who else finds out that the party has been taught, and what do they do about it?
  - If the party never returns for the fourth teaching, does the envoy come looking?
