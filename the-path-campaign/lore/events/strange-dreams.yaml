featureQuestions:
  - What has this character been avoiding, and how long have they managed it?
  - Who else is awake to see them sleeping badly?
  - Does anyone tell the others what they saw, and what do they leave out?
  - What would make someone choose Depth 3 on purpose?
  - If the same dream comes back on another night, what has changed in it?
