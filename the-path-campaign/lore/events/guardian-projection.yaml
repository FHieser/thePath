featureQuestions:
  - Which Ancient Guardian is projecting here, and what does it actually want from these particular mortals?
  - What action drew its attention — and did the party understand what they were doing when they took it?
  - What would these mortals have to do for it to seek them out a second time?
  - How does the projection manifest in this place? What does it displace or change to make room for itself?
