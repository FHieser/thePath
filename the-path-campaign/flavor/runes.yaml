title: The Runes
intro: |
  The twenty-four runes of the Elder Futhark, grouped in three ætts of eight. Each rune lists its literal meaning, a broader sense, and what it means when it stands in the sky during a reading.
source: |
  The rune names are modern reconstructions in Proto-Germanic; no name list survives from the period the Elder Futhark was in use (c. 2nd–8th century). The earliest complete row is carved on the Kylver Stone (Gotland, c. 400 AD). Most meanings come from much later rune poems — the Old English (c. 8th–10th century), Old Norwegian and Old Icelandic (c. 12th–15th century) — which describe the later Anglo-Saxon and Younger Futhark rows. Where the poems disagree or are silent, the meaning is marked as uncertain. The order of the final runes varies between sources (Dagaz and Othala are often swapped).

  The readings are this campaign's own interpretation for Wandering Stars readings.

  Further reading: R. I. Page, Runes; Ralph W. V. Elliott, Runes: An Introduction.

decoding: |
  Players are not given the meaning of a rune. They uncover it through the Wandering Stars.

  When a rune stands in the sky, the GM shows planets alongside it, chosen so that their domains describe the rune. The players guess what the rune means. Depending on how close the guess comes, the GM grants them one or more of the rune's three levels — literal, broader, reading. A player who holds all three levels knows the rune fully.

