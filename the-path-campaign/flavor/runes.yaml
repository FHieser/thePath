title: The Runes
intro: |
  The twenty-four runes of the Elder Futhark, grouped in three ætts of eight. This is the real-world reference list the campaign's runes are drawn from — their meaning within the mist is defined separately.
source: |
  The rune names are modern reconstructions in Proto-Germanic; no name list survives from the period the Elder Futhark was in use (c. 2nd–8th century). The earliest complete row is carved on the Kylver Stone (Gotland, c. 400 AD). Most meanings come from much later rune poems — the Old English (c. 8th–10th century), Old Norwegian and Old Icelandic (c. 12th–15th century) — which describe the later Anglo-Saxon and Younger Futhark rows. Where the poems disagree or are silent, the meaning is marked as uncertain. The order of the final runes varies between sources (Dagaz and Othala are often swapped).

  Further reading: R. I. Page, Runes; Ralph W. V. Elliott, Runes: An Introduction.

aetts:
  - name: Freyr's Ætt
    runes:
      - name: Fehu
        glyph: ᚠ
        sound: f
        meaning: Cattle, wealth
      - name: Uruz
        glyph: ᚢ
        sound: u
        meaning: Aurochs, strength
      - name: Thurisaz
        glyph: ᚦ
        sound: th
        meaning: Giant, thorn
      - name: Ansuz
        glyph: ᚨ
        sound: a
        meaning: God, breath, word
      - name: Raidho
        glyph: ᚱ
        sound: r
        meaning: Riding, journey
      - name: Kenaz
        glyph: ᚲ
        sound: k
        meaning: Torch
      - name: Gebo
        glyph: ᚷ
        sound: g
        meaning: Gift, exchange
      - name: Wunjo
        glyph: ᚹ
        sound: w
        meaning: Joy

  - name: Hagal's Ætt
    runes:
      - name: Hagalaz
        glyph: ᚺ
        sound: h
        meaning: Hail
      - name: Naudiz
        glyph: ᚾ
        sound: n
        meaning: Need, hardship
      - name: Isa
        glyph: ᛁ
        sound: i
        meaning: Ice
      - name: Jera
        glyph: ᛃ
        sound: j
        meaning: Year, harvest
      - name: Eihwaz
        glyph: ᛇ
        sound: ei / æ
        meaning: Yew
      - name: Perthro
        glyph: ᛈ
        sound: p
        meaning: Uncertain — often read as a lot-cup or game
      - name: Algiz
        glyph: ᛉ
        sound: z
        meaning: Elk, or elk-sedge
      - name: Sowilo
        glyph: ᛊ
        sound: s
        meaning: Sun

  - name: Týr's Ætt
    runes:
      - name: Tiwaz
        glyph: ᛏ
        sound: t
        meaning: The god Týr
      - name: Berkano
        glyph: ᛒ
        sound: b
        meaning: Birch
      - name: Ehwaz
        glyph: ᛖ
        sound: e
        meaning: Horse
      - name: Mannaz
        glyph: ᛗ
        sound: m
        meaning: Man, human
      - name: Laguz
        glyph: ᛚ
        sound: l
        meaning: Water, lake
      - name: Ingwaz
        glyph: ᛜ
        sound: ng
        meaning: The god Ing
      - name: Dagaz
        glyph: ᛞ
        sound: d
        meaning: Day
      - name: Othala
        glyph: ᛟ
        sound: o
        meaning: Inherited land, ancestral home
