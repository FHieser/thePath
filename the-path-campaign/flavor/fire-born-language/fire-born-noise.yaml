title: Fire Born Noise
description: |
  The Fire Born no longer fully parse mortal language. What they speak instead is noise: iron groaning
  under its own weight, struck metal, the roar of the brazier they cannot leave. The Mist Born are
  Nothing and silence; the Fire Born are Everything and sound. Where they speak, the mist goes quiet.

  The words below are the GM's dictionary. Each word is synthesized live from the building-block
  sounds (no audio files) by the Noise page in the webapp. Never translate for the players: they
  only get the noise. Over time, players who listen closely can pick up the roots and start
  understanding pieces of it.

# The logic that holds the language together. Words that share a meaning share a sound, so the
# language can be learned by ear, slowly, the way a scholar who followed a carrier might have.
roots:
  - root: Toward
    sound: A groan that rises in pitch
    meaning: Approach, welcome, asking, anything good
  - root: Away
    sound: A groan that falls in pitch
    meaning: Departure, refusal, threat, anything bad
  - root: Flame
    sound: The brazier roar swelling up
    meaning: Fire, the Fire Born themselves, safety
  - root: Mist
    sound: A hiss over a muffled, swallowed groan
    meaning: The mist, the Mist Born, the Nothing
  - root: Thing
    sound: A struck-metal clank
    meaning: Objects, matter, something you can hold
  - root: Sacred
    sound: A high bell chime
    meaning: The god, relics, what must be honored
  - root: Ground
    sound: A heavy thud, like a carrier's foot coming down
    meaning: Places, standing, moving across the land
  - root: Alarm
    sound: Rapid, frantic clanking
    meaning: Urgency, danger

# Building blocks the Noise page knows how to voice. A word's `sequence` is a list of these.
# Every parameter is optional; leave it out and the sound uses its default.
#
# Timing within a sequence:
#   (default)  starts after the previous sound ends, plus `gap` seconds (default 0.06, may be negative)
#   with: true starts at the same moment as the previous sound
#   at: 1.2    starts 1.2 seconds after the word begins
sounds:
  - id: groan
    description: The iron-golem voice. A creaking pulse stream shaped by vowels and a hollow iron chest.
    params: "from, to (pitch in Hz, ~30-120), dur, vowel/toVowel (oo, oh, ah, eh, ee, uh, mm), curve (glide shape), rough (0-0.5 creakiness), drop (0-0.5 stutter), wobble, ring (chest resonance 0-0.9), gain"
  - id: clank
    description: Struck heavy metal, ringing out.
    params: "pitch (Hz, ~80-400), ring (seconds of ring), weight (true adds a low thump), damp (true muffles it), dur, gain"
  - id: creak
    description: A rusty hinge. Slow irregular ticks with a metallic pitch.
    params: "rate (ticks per second), toRate, pitch (Hz of the ring), dur, gain"
  - id: roar
    description: The brazier flaring up and settling, with embers.
    params: "dur, gain"
  - id: crackle
    description: Embers popping.
    params: "dur, density (pops per second), dying (true thins out toward the end), gain"
  - id: hiss
    description: Steam venting, or the mist itself.
    params: "pitch, toPitch (filter sweep in Hz), dur, gain"
  - id: hum
    description: A deep resonant drone that shimmers. The air around a carrier.
    params: "pitch (Hz), dur, gain"
  - id: chime
    description: High inharmonic bells.
    params: "pitch, count, spacing, gain"
  - id: thud
    description: A heavy construct footstep.
    params: "dur, gain"
  - id: horn
    description: A long low iron call, the sound a carrier makes across distance.
    params: "pitch, to, dur, vowel/toVowel, gain"
  - id: pulse
    description: Repeating pings, like pointing with sound.
    params: "count, pitch, interval, accel (interval multiplier per ping), rise (pitch multiplier per ping), gain"
  - id: grind
    description: Gears grinding against each other.
    params: "rate, toRate, dur, gain"
  - id: rest
    description: Silence.
    params: "dur"

categories:
  - Greetings & Answers
  - Beings
  - Actions
  - Things
  - Places & States

words:
  # ── Greetings & Answers ──────────────────────────────────────────
  - id: hello
    word: Hello
    category: Greetings & Answers
    roots: [Flame, Toward]
    note: More acknowledgment than greeting. "You are seen. You stand in the light."
    sequence:
      - { p: roar, dur: 1.0, gain: 0.6 }
      - { p: groan, from: 48, to: 72, dur: 1.3, vowel: oo, toVowel: ah, wobble: 0.02, gap: -0.5 }
      - { p: clank, pitch: 210, gap: 0.12 }
      - { p: clank, pitch: 210, gap: 0.1 }

  - id: bye
    word: Bye
    category: Greetings & Answers
    roots: [Flame, Away]
    note: The brazier settles and the voice sinks away. They do not wait for a reply.
    sequence:
      - { p: groan, from: 70, to: 44, dur: 1.4, vowel: ah, toVowel: mm, wobble: 0.02 }
      - { p: roar, dur: 1.4, gain: 0.45, gap: -0.9 }
      - { p: clank, pitch: 150, damp: true, gain: 0.6, gap: -0.2 }

  - id: yes
    word: Yes
    category: Greetings & Answers
    roots: [Thing]
    sequence:
      - { p: clank, pitch: 240, ring: 1.6 }
      - { p: clank, pitch: 240, ring: 1.6, gap: 0.16 }
      - { p: hum, pitch: 80, dur: 1.0, gain: 0.5, gap: 0.02 }

  - id: no
    word: No
    category: Greetings & Answers
    roots: [Thing, Away]
    sequence:
      - { p: clank, pitch: 300 }
      - { p: clank, pitch: 150, weight: true, gap: 0.16 }
      - { p: groan, from: 64, to: 38, dur: 0.9, vowel: ah, toVowel: uh, rough: 0.25, gap: 0.04 }

  - id: question
    word: What? (question)
    category: Greetings & Answers
    roots: [Toward]
    note: Put it after another word to make a question. "Relic · What?" is "Is that a relic?"
    sequence:
      - { p: creak, dur: 0.5, rate: 14, pitch: 850 }
      - { p: groan, from: 50, to: 115, curve: 3, dur: 1.1, vowel: oh, toVowel: ee, gap: 0.04 }

  # ── Beings ───────────────────────────────────────────────────────
  - id: friend
    word: Friend
    category: Beings
    roots: [Toward, Sacred]
    note: Rare. Said of someone who has fed or defended a flame.
    sequence:
      - { p: hum, pitch: 74, dur: 1.8, gain: 0.6 }
      - { p: groan, from: 55, to: 76, dur: 1.2, vowel: oo, toVowel: oh, rough: 0.08, ring: 0.8, at: 0.2 }
      - { p: chime, count: 1, pitch: 660, at: 1.2 }

  - id: foe
    word: Foe
    category: Beings
    roots: [Away, Mist]
    sequence:
      - { p: grind, dur: 0.8, rate: 40 }
      - { p: groan, from: 60, to: 36, dur: 1.2, vowel: uh, toVowel: oo, rough: 0.35, with: true }
      - { p: hiss, dur: 0.6, gain: 0.7, gap: -0.3 }

  - id: you
    word: You
    category: Beings
    roots: [Toward]
    note: A ping aimed at someone. Usually comes with the brazier turning toward them.
    sequence:
      - { p: pulse, count: 1, pitch: 300 }
      - { p: groan, from: 64, to: 70, dur: 0.6, vowel: eh, gap: -0.2 }

  - id: we
    word: We (the Fire Born)
    category: Beings
    roots: [Flame]
    sequence:
      - { p: roar, dur: 1.4, gain: 0.5 }
      - { p: hum, pitch: 55, dur: 1.6, gain: 0.6, with: true }
      - { p: groan, from: 45, to: 46, dur: 1.1, vowel: oh, rough: 0.05, ring: 0.82, at: 0.3 }

  - id: mist-born
    word: Mist Born
    category: Beings
    roots: [Mist, Away]
    sequence:
      - { p: hiss, dur: 1.2, pitch: 5000, toPitch: 1800 }
      - { p: groan, from: 36, to: 30, dur: 1.2, vowel: mm, rough: 0.3, drop: 0.3, gain: 0.6, with: true }
      - { p: clank, pitch: 120, damp: true, gain: 0.5, gap: 0.05 }

  # ── Actions ──────────────────────────────────────────────────────
  - id: attack
    word: Attack
    category: Actions
    roots: [Ground, Flame]
    sequence:
      - { p: horn, pitch: 45, to: 52, dur: 1.2 }
      - { p: thud, at: 0.6, dur: 0.22 }
      - { p: thud, dur: 0.22 }
      - { p: thud, dur: 0.22 }
      - { p: roar, dur: 1.0, gain: 1.2, gap: -0.2 }

  - id: help
    word: Help
    category: Actions
    roots: [Toward, Alarm]
    note: Urgent and repeated. A Paladin with a guttering flame might make this sound.
    sequence:
      - { p: groan, from: 50, to: 92, curve: 2, dur: 0.7, vowel: oh, toVowel: ee, rough: 0.2 }
      - { p: groan, from: 50, to: 96, curve: 2, dur: 0.7, vowel: oh, toVowel: ee, rough: 0.25, gap: 0.08 }
      - { p: pulse, count: 3, pitch: 340, interval: 0.14, gap: 0.05 }

  - id: follow
    word: Follow / That way
    category: Actions
    roots: [Ground, Toward]
    sequence:
      - { p: thud }
      - { p: pulse, count: 5, pitch: 260, interval: 0.5, accel: 0.8, gap: 0.1 }
      - { p: groan, from: 58, to: 66, dur: 0.6, vowel: eh, gap: 0.05 }

  - id: leave
    word: Leave / Back away
    category: Actions
    roots: [Away]
    sequence:
      - { p: grind, dur: 1.4, rate: 44, toRate: 30 }
      - { p: groan, from: 40, to: 30, dur: 1.4, vowel: uh, toVowel: oo, rough: 0.35, drop: 0.1, at: 0.15 }
      - { p: hiss, dur: 1.0, pitch: 3500, toPitch: 8000, gain: 0.9, gap: -0.5 }

  - id: wait
    word: Wait / Stay
    category: Actions
    roots: [Thing]
    sequence:
      - { p: hum, pitch: 70, dur: 1.6, gain: 0.7 }
      - { p: clank, pitch: 180, damp: true, gap: -0.3 }

  # ── Things ───────────────────────────────────────────────────────
  - id: flame
    word: Flame
    category: Things
    roots: [Flame]
    sequence:
      - { p: roar, dur: 1.6 }
      - { p: crackle, dur: 1.6, density: 30, with: true }
      - { p: hum, pitch: 62, dur: 1.4, gain: 0.5, at: 0.3 }

  - id: mist
    word: Mist
    category: Things
    roots: [Mist]
    note: The only word they say quietly.
    sequence:
      - { p: hiss, dur: 1.8, pitch: 6000, toPitch: 1500, gain: 0.7 }
      - { p: groan, from: 34, to: 32, dur: 1.6, vowel: mm, drop: 0.4, gain: 0.45, with: true }

  - id: object
    word: Object / Thing
    category: Things
    roots: [Thing]
    sequence:
      - { p: clank, pitch: 260 }
      - { p: creak, dur: 0.35, rate: 16, pitch: 1100, gain: 0.6, gap: 0.02 }

  - id: relic
    word: Relic
    category: Things
    roots: [Thing, Sacred]
    note: Anything made by or for the god, including Fire Born items the players carry.
    sequence:
      - { p: clank, pitch: 200, ring: 2 }
      - { p: chime, count: 2, pitch: 720, spacing: 0.25, gap: 0.05 }
      - { p: hum, pitch: 82, dur: 1.2, gain: 0.45, with: true }

  - id: chain
    word: Chain
    category: Things
    roots: [Thing, Away]
    note: The god's chains. Said heavily, link by link, every link lower.
    sequence:
      - { p: clank, pitch: 220, weight: true, dur: 0.35 }
      - { p: clank, pitch: 196, weight: true, dur: 0.35 }
      - { p: clank, pitch: 175, weight: true, dur: 0.35 }
      - { p: clank, pitch: 147, weight: true, ring: 2.2, dur: 0.4 }
      - { p: grind, dur: 0.6, rate: 30, gain: 0.5 }

  - id: god
    word: God
    category: Things
    roots: [Sacred, Flame]
    note: The imprisoned god of War and Expansion. Spoken slowly, as a hymn.
    sequence:
      - { p: hum, pitch: 41, dur: 4 }
      - { p: groan, from: 41, to: 41, dur: 2.2, vowel: oo, toVowel: ah, rough: 0.04, ring: 0.85, at: 0.5 }
      - { p: chime, count: 2, pitch: 660, spacing: 0.8, at: 1.4 }
      - { p: clank, pitch: 110, ring: 3, at: 3.0 }

  # ── Places & States ──────────────────────────────────────────────
  - id: location
    word: Location / Place
    category: Places & States
    roots: [Ground]
    sequence:
      - { p: thud }
      - { p: thud, gap: 0.1 }
      - { p: pulse, count: 2, pitch: 200, interval: 0.3, gap: 0.05 }

  - id: danger
    word: Danger
    category: Places & States
    roots: [Alarm]
    sequence:
      - { p: clank, pitch: 330, dur: 0.11 }
      - { p: clank, pitch: 310, dur: 0.11, gap: 0.03 }
      - { p: clank, pitch: 345, dur: 0.11, gap: 0.03 }
      - { p: clank, pitch: 300, dur: 0.11, gap: 0.03 }
      - { p: creak, dur: 0.5, rate: 30, pitch: 1400, gap: 0 }
      - { p: horn, pitch: 58, to: 70, dur: 1.0, gap: 0.04 }

  - id: safe
    word: Safe
    category: Places & States
    roots: [Flame, Sacred]
    sequence:
      - { p: roar, dur: 1.4, gain: 0.5 }
      - { p: hum, pitch: 80, dur: 1.6, gain: 0.6, at: 0.2 }
      - { p: chime, count: 1, pitch: 520, at: 0.9 }

  - id: death
    word: Death / Extinguished
    category: Places & States
    roots: [Flame, Away]
    note: For a Fire Born, death and a flame going out are the same word.
    sequence:
      - { p: groan, from: 62, to: 28, curve: 0.6, dur: 2.6, vowel: oh, toVowel: mm, rough: 0.2, wobble: 0.03 }
      - { p: crackle, dur: 2.8, density: 30, dying: true, at: 0.2 }
      - { p: chime, count: 1, pitch: 520, at: 2.9 }
