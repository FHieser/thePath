  difficulty: 15
  thresholds:
    major: 16
    severe: 30
  hp: 4
  stress: 4
  attack:
    bonus: '+3'
    name: Iron Claws
    range: Melee
    damage: 2d8+7 physical
  experience:
  - name: Stealth
    value: 3
  - name: Track by Blood
    value: 3
  features:
  - name: Iron Blood
    type: Passive
    description: When the Ironshade takes the spotlight, if it has any marked Hit Points, it clears **1 HP**.
  - name: Strike and Fade
    type: Passive
    description: After the Ironshade makes a standard attack, it can move up to **Close** range.
  - name: Unseen Teeth
    type: Passive
    description: When the Ironshade makes a successful attack, you gain **1 Fear**.
