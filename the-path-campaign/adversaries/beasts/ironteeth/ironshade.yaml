name: Ironshade
category: Skulk
description: Smaller and leaner than the Ironfang, with long legs and a narrow head. The spikes on its back lie flat against its spine, and its grey coat blends into the iron trunks. On its flank, a darker pattern in the fur forms the rune Fehu. It watches from just beyond where the eye can follow, and it is gone before anyone can turn.
motives: Follow at a distance, single out the alone, strike and vanish, bring the pack
lore: The Ironteeth descend from the seven who gave themselves at the Ancestor's ascension. The ritual took what they were and left beasts, and those beasts have bred in the Eisenwald ever since. The Ironshade is the pack's eyes. It finds what is bleeding in the forest and follows it until the others come.
tiers:
