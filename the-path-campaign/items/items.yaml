# The Path - Items
# Sorted by type: General first, then Village market goods, then faction items grouped by faction name,
# then Custom items last (player-created items that don't belong to a faction's Item Identity)

# ============================================================
# GENERAL ITEMS
# ============================================================

- name: Cliffgold
  type: General
  usage: Consumable
  tier: 2
  tradeValue: 2
  flavor: "A bright yellow flower that clings to cliff faces where nothing else grows — ancient, stubborn, and worth the reach."
  effect:
    category: Restoration
    description: |
      Consume during a rest. Remove 3 Mist tokens.

- name: Deadnerve
  type: General
  usage: Consumable
  tier: 1
  tradeValue: 1
  flavor: "A bitter black paste that numbs the tongue and quiets the mind."
  effect:
    category: Restoration
    description: |
      Can only be consumed during an encounter. Clear 2 Stress.

- name: Rushpowder
  type: General
  usage: Consumable
  tier: 1
  tradeValue: 1
  flavor: "A pinch of sharp white powder that makes the air taste like lightning."
  effect:
    category: Enhancement
    description: |
      Can only be inhaled during an encounter. Gain advantage on all Agility rolls for the rest of the scene.

- name: Iron Nerve Paste
  type: General
  usage: Consumable
  tier: 2
  tradeValue: 0.75
  flavor: "A grey-black paste that smells faintly of copper and old stone. Applied to the temple, it doesn't numb the pain — it convinces you the pain was never worth feeling."
  effect:
    category: Restoration
    description: |
      When you would mark Stress from any source, you may apply a dose as a reaction to negate that Stress instead. The paste has 3 uses per Long Rest.

      Each time you use a dose, the next time you would recover Stress (from any source), you recover 1 less Stress for each dose used since your last Long Rest. If this reduces your recovery to 0 or less, you recover no Stress from that source.

- name: Smoke Vials
  type: General
  usage: Consumable
  tier: 2
  tradeValue: 1.5
  flavor: "Three squat vials of grey compound, stoppered with wax and labelled in a precise hand."
  effect:
    category: Utility
    description: |
      Throw the vials to shatter them and fill the area with obscuring vapour, then move up to Close range under cover of it. You cannot be targeted by ranged attacks until you make an attack.

- name: Silkweaver
  type: General
  usage: Reusable
  tier: 2
  tradeValue: not tradeable — a living gift from the Spider Queen, not merchandise
  flavor: "She fits in a palm, weighs almost nothing, and the silk she produces is flawless — the Queen does not give gifts lightly."
  effect:
    category: Utility
    description: |
      Once per long Rest, the Silkweaver can spin one silk item. Describe what you weave; the GM assigns a minor utility effect appropriate to its form (a length of rope, a wrapped bundle, a woven strip, a simple garment).

      Each Short Rest, in plain sight, the spider spins a small open-weave net and releases it to the wind. It drifts away on the breeze — visible to anyone watching, gone within moments. The net carries encoded information: scent-traces, the shape of where you have been, the faces of those nearby. The Queen's drones intercept these nets. She accumulates knowledge of your movements and will act on what she learns when the time is right.

# ============================================================
# VILLAGE ITEMS
# ============================================================
# Mundane goods available at the Village's Trading Grounds / Supply Cache —
# standard Daggerheart consumables, unmodified from the SRD, priced as the
# baseline reference point for the Trade Points system (see crafting-and-trading-mechanics.yaml).

- name: Hope in a Bottle
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "A small glass vial filled with warm golden light that sloshes like liquid sunshine."
  effect:
    category: Restoration
    description: |
      Drink the vial to gain 1 Hope. If you currently have no Hope, gain 2 Hope instead.

- name: Stride Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "A thin, fizzing draught that makes your feet feel lighter before it's even swallowed."
  effect:
    category: Enhancement
    description: |
      You gain a +1 bonus to your next Agility Roll.

- name: Bolster Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "Thick and bitter, it settles into the muscle like liquid iron."
  effect:
    category: Enhancement
    description: |
      You gain a +1 bonus to your next Strength Roll.

- name: Control Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "A cool, silver-tinged tonic that steadies trembling hands."
  effect:
    category: Enhancement
    description: |
      You gain a +1 bonus to your next Finesse Roll.

- name: Attune Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "Tastes of static — drink it and the world's edges sharpen for a moment."
  effect:
    category: Enhancement
    description: |
      You gain a +1 bonus to your next Instinct Roll.

- name: Charm Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "Sweet as syrup, it loosens the tongue and softens the face."
  effect:
    category: Enhancement
    description: |
      You gain a +1 bonus to your next Presence Roll.

- name: Enlighten Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "Bitter root tea that leaves your thoughts unusually clear."
  effect:
    category: Enhancement
    description: |
      You gain a +1 bonus to your next Knowledge Roll.

- name: Firepatch
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 0.75
  flavor: "A rough bandage soaked in alchemical fire that sears wounds shut on contact."
  effect:
    category: Restoration
    description: |
      Can only be used during an encounter. Press it against an open wound to heal 2 HP. Mark 2 Stress - the burning is excruciating.

- name: Minor Health Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 1
  flavor: "A small vial of common healing draught, watered down but reliable."
  effect:
    category: Restoration
    description: |
      Clear 1d4 Hit Points.

- name: Minor Stamina Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 1
  flavor: "A weak restorative brew, the kind every village apothecary keeps in bulk."
  effect:
    category: Restoration
    description: |
      Clear 1d4 Stress.

- name: Health Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 1.5
  flavor: "A standard healing draught, red as a fresh wound and twice as common."
  effect:
    category: Restoration
    description: |
      Clear 1d4+1 Hit Points.

- name: Stamina Potion
  type: Village
  usage: Consumable
  tier: 1
  tradeValue: 1.5
  flavor: "A standard restorative tonic, brewed in batches for travelers passing through."
  effect:
    category: Restoration
    description: |
      Clear 1d4+1 Stress.

# ============================================================
# BLOOD ITEMS
# ============================================================

- name: Archon's Reserves
  type: Blood
  usage: Reusable
  tier: 1
  tradeValue: 1
  flavor: "A dark glass vial etched with ancient channel-marks, always faintly warm to the touch."
  effect:
    category: Utility
    description: |
      Spend 1 HP at any time to fill the vial with your blood. The vial holds 1 HP of blood. Pour the filled vial at a location that requires a blood sacrifice to count as 1 HP of sacrifice. Multiple vials can be used together to meet higher sacrifice costs.

- name: Rapid Mutator
  type: Blood
  usage: Consumable
  tier: 2
  tradeValue: 1.5
  flavor: "A crude syringe of dark red compound that smells of iron and copper wire — the Archon's handwriting is on the label, neat as a death sentence."
  effect:
    category: Restoration
    description: |
      Inject during an encounter. Regain 5 HP. Gain 2 Stress. Mark your first unmarked Hit Point — this slot cannot be healed until you spend a Long Rest action to regenerate it.

- name: Hemofog Vial
  type: Blood
  usage: Consumable
  tier: 2
  tradeValue: 2
  flavor: "Smoke vials enchanted with hemomancy. The blood ignites with the blackpowder and leaves a blood-red mist that attacks the lifeforce of anything still standing in it."
  effect:
    category: Disruption
    description: |
      Mark 1 HP to shatter the vial, mixing your own blood into the vapour, then move up to Close range under cover of it. You cannot be targeted by ranged attacks until you make an attack.

      Each other creature within Close range must succeed on an Agility Reaction Roll (13) or take 2d8 magic damage.

- name: Red Eye
  type: Blood
  usage: Reusable
  tier: 2
  tradeValue: 2.5
  flavor: "A plague crystal fused with mist essence and blood — look into it and the dark coils move, and something inside looks back."
  effect:
    category: Restoration
    description: |
      Hold the Red Eye and focus. Regain 1 HP and clear 1 Stress. Gain Mist tokens equal to the number of times you have used the Red Eye since your last Long Rest.

      First use: +1 Mist token. Second use: +2 Mist tokens. Third use: +3 Mist tokens.

      The usage counter resets on a Long Rest.

- name: Sanguine Cage
  type: Blood
  usage: Reusable
  tier: 2
  tradeValue: 3
  flavor: "Interlocked bones sealed with hardened blood — crafted through hemomancy, worn by those who know the body is a resource to be spent wisely."
  effect:
    category: Protection
    description: |
      Tier 2 armor. Thresholds: 9 / 20.

      Blood Chamber: At any time, spend HP to fill the chamber (up to 3 HP maximum). At any time, draw 1 HP from the chamber to restore it to yourself. HP stored in the chamber persists until spent.

- name: Blood-Soaked Talisman
  type: Blood
  usage: Consumable
  tier: 3
  tradeValue: 7
  flavor: "A twist of blood-dark cord and bone, tied by something that remembers only violence."
  effect:
    category: Disruption
    description: |
      Break the talisman to tear a screaming shape free of it: the ghost falls upon a single enemy of your choice within sight and destroys it outright. If the target is a Leviathan-class Colossus, the ghost instead destroys one of its segments that is not marked as vital. Every PC in the party marks 1 HP as the ghost tears free on its way out.

# ============================================================
# ROOTBOUND ITEMS
# ============================================================

- name: Dreaming Bark
  type: Rootbound
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "A strip of pale bark that tastes of soil and sleep. Chew it and the world behind your eyes opens."
  effect:
    category: Utility
    description: |
      Consume the bark to enter a brief trance. The GM reveals all face-down location cards adjacent to your current location on the Path grid. Mark 1 Stress for each card revealed - the visions come at a cost.

- name: Lullroot
  type: Rootbound
  usage: Consumable
  tier: 1
  tradeValue: 1
  flavor: "A soft, fibrous root that smells of rain-soaked earth and quiet evenings."
  effect:
    category: Restoration
    description: |
      Can only be consumed during a rest. Clear 1 Stress and heal 1 HP.

- name: Dewcleanse
  type: Rootbound
  usage: Consumable
  tier: 1
  tradeValue: 2
  flavor: "A pouch of dried herbs that blooms into fragrant tea when steeped in warm water. Quite some powerful stuff, but takes a while to get going. Tastes good too."
  effect:
    category: Restoration
    description: |
      Brew during a rest. Every player who is resting may drink and remove 2 Mist tokens. Preparing the tea takes time - it cannot be rushed or brewed during an encounter.

- name: Circle Ash
  type: Rootbound
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "Fine grey ash that drifts against the wind when released near fey-touched ground."
  effect:
    category: Utility
    description: |
      Throw the ash into a Mushroom Circle. The particles swirl and drift toward the direction of linked Mushroom Circle locations, showing you which way to face before stepping in.

# ============================================================
# FIRE BORN ITEMS
# ============================================================

- name: Flame Bearer's Amulet
  type: Fire Born
  usage: Reusable
  tier: 1
  tradeValue: 1.5
  flavor: "A flat disc of alien metal, warm to the touch even in the deepest mist, inscribed with symbols no mortal language reads."
  effect:
    category: Protection
    description: |
      Once per Long Rest: when you would gain a Mist token, negate 1 token. The amulet grows cold after use and must be warmed again through rest near flame.

- name: Flame Blade
  type: Fire Born
  usage: Reusable
  tier: 2
  tradeValue: 4
  flavor: "An ancient blade of alien metal that runs hot in the hand — the flame inside it does not care whose blood it burns."
  effect:
    category: Disruption
    description: |
      Two-handed. Attacks use Strength or Agility (wielder's choice).

      When drawn, lose 3 HP and remove 2 Mist tokens from yourself. The blade's fire burns the mist corruption out of the wielder as it ignites.

      While drawn: d10+7 damage — Powerful (on a successful attack, roll an additional d10 and discard the lowest result) — Burning (when you roll max damage on a damage die, the target must mark a Stress).

      The blade goes dormant when sheathed and must be drawn again to use.

- name: Ember Weave
  type: Fire Born
  usage: Reusable
  tier: 2
  tradeValue: 2
  flavor: "A shred of the old pilgrimage, warm where everything else is cold. Hold it up and something remembers what it meant to believe in fire."
  effect:
    category: Enhancement
    description: |
      Hold the Ember Weave aloft and spend 1 Flame Essence. The flame-thread ignites briefly, casting gold light across everyone nearby. Each player present gains 1 Hope and removes 1 Mist token. The weave dims after use until fed flame again.

- name: Flashburn
  type: Fire Born
  usage: Consumable
  tier: 2
  tradeValue: 1.5
  flavor: "A compact torch that flares with blinding sacred light, pushing the shadows back - but they always return deeper."
  effect:
    category: Restoration
    description: |
      Light the Flashburn. Distribute 3 Hope among the players. The GM gains 2 Fear - the mist recoils from the flame but the shadows grow larger in answer.

- name: Cracked Fire Claws
  type: Fire Born
  usage: Reusable
  tier: 3
  tradeValue: 4
  flavor: "Clawed gauntlets of alien metal run hot along the fracture lines and hotter when you close your fist."
  effect:
    category: Enhancement
    description: |
      While worn, gain advantage on all rolls made to climb.

      Charged: Mark a Stress to gain a +1 bonus to your Proficiency on a primary weapon attack. Take 1 HP damage and remove 1 Mist token — the flame runs through the broken plates and into your hands before it ever reaches the weapon.

      The claws function even if your primary weapon is two-handed.

# ============================================================
# BRASS MECHANICORUM ITEMS
# ============================================================

- name: Br4ss Filt3r
  type: Brass Mechanicorum
  usage: Reusable
  tier: 2
  tradeValue: 2
  flavor: "A small cylindrical device of polished brass and crystal mesh that hums faintly, drawing moisture from the air."
  effect:
    category: Protection
    description: |
      While carried, the Br4ss Filt3r absorbs Mist tokens before they reach you. It can absorb up to 3 Mist tokens total. Once full, it stops working and must be replaced or repaired by the Brass Mechanicorum.

# ============================================================
# COPPER RUST CLAN ITEMS
# ============================================================

- name: Rune Hammer
  type: Copper Rust Clan
  usage: Permanent
  tier: 3
  tradeValue: null
  flavor: "A hammer and chisel formed by the Press in the Forge Quarter and finished by the pipes in the Shrine — the enchantment lives in the handle, not the head. It hums faintly against worked stone."
  effect:
    category: Utility
    description: |
      Ritual Item. The Rune Hammer is tied to the player who completed its enchantment in the Copper Rust Sanctuary and cannot be traded or transferred.

      While carried, the bearer adds +3 to all enchantment rolls made at the Rune Station (Deep Station) and the Master Forge (Copper Rust Sanctuary).

# ============================================================
# MIST BORN ITEMS
# ============================================================

- name: Claw of the Mist
  type: Mist Born
  usage: Reusable
  tier: 2
  tradeValue: 3.5
  flavor: "Coral-marked metal prongs arc from a central sphere, curving closed at both tips — the sphere breathes pale mist that seeps outward along each arm in slow, continuous curls."
  effect:
    category: Protection
    description: |
      Offhand weapon.

      Deflecting (Passive): When you are attacked, you may mark an Armor Slot to gain a bonus to your Evasion equal to your available Armor Slots against that attack.

      Embrace of the Mist (Action): Gain Mist tokens without suffering their immediate consequence, then clear 2 Stress. The number of tokens required scales with your attunement — the deeper you are in the nothing, the less it costs to receive the teaching:

      - 0–3 tokens: gain 3 Mist tokens
      - 4–6 tokens: gain 2 Mist tokens
      - 7+ tokens: gain 1 Mist token

- name: The Claiming Conch
  type: Mist Born
  usage: Reusable
  tier: 3
  tradeValue: 4
  flavor: "Split when it died, but the depths still broadcast through the crack. Something below is still listening."
  effect:
    category: Utility
    description: |
      Press the shell to your ear. Gain 1 Mist token — you do not suffer its immediate consequence. The number of uses per long rest and the strength of the effect depend on your current Mist token total:

      - 0 tokens: Gain 1 Mist token (no immediate consequence). The conch does not answer. The void does not yet know you.
      - 1–3 tokens (1 use per long rest): Gain 1 Mist token (no immediate consequence). Ask the conch a question. It answers.
      - 4–6 tokens (2 uses per long rest): Gain 1 Mist token (no immediate consequence). Ask the conch a question. It answers. The GM loses 1 Fear.
      - 7–9 tokens (3 uses per long rest): Gain 1 Mist token (no immediate consequence). Ask the conch a question. It answers. The GM loses 2 Fear.

      Crossing into a higher tier mid-session immediately grants access to the additional use(s) for that tier.

      The conch speaks in fragments and doctrine. The GM answers in the voice of the void:

      "What is the mist?" — "We are nothing."
      "Why do you attack us?" — "Because of the flame. Do not wake him up."
      "What are your goals?" — "We extinguish the flame. Keep him in the nothing."
      "What is the flame?" — "Rouses of him trying to wake."
      "Is there a way to end this?" — "Yes. Extinguish every flame. Let him sleep undisturbed."

- name: Tidepole Marker
  type: Mist Born
  usage: Reusable
  tier: 2
  tradeValue: 3
  flavor: "Something in the deep end of the mist recognizes this shape. It doesn't know the signal is wrong."
  effect:
    category: Disruption
    description: |
      Requires Strength +1 or higher to carry — the pole is dense iron, heavy with age and residual void energy.

      Drive the pole into the ground and channel mist through its broken scan network. Gain Mist tokens without suffering their immediate consequence — in exchange, the GM removes 1 Fear. The amount you feed depends on how deep you already are:

      - 0–2 Mist tokens: Gain 3 Mist tokens
      - 3–5 Mist tokens: Gain 2 Mist tokens
      - 6–9 Mist tokens: Gain 1 Mist token

      The pole hums while grounded, broadcasting to a network that no longer receives.

- name: Netos' Protection
  type: Mist Born
  usage: Reusable
  tier: 2
  tradeValue: 2
  flavor: "A band of layered coral-scale grown in the shape of an old guardian's hide, cold and faintly damp against the skin."
  effect:
    category: Protection
    description: |
      Twist the ring. Mist escapes from the coral-scale in a thin hiss and crawls into the crack of a marked Armor Slot, sealing it shut from the inside.

      Clear 1 marked Armor Slot. Gain Mist tokens without suffering their immediate consequence — the first use since your last long rest costs 1 Mist token, and each use after costs 1 more than the last. The debt resets when you finally do a long rest.

# ============================================================
# THE CROAK ITEMS
# ============================================================

- name: Mist Protection Charm
  type: The Croak
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "A small wooden bead carved with a simple ward-mark, strung on rough cord. Travelers going into the mist tie a handful to their wrists and come back with fewer than they left with."
  effect:
    category: Protection
    description: |
      When you would gain a Mist token, you may destroy this charm to negate that token.

- name: Reed Candle
  type: The Croak
  usage: Consumable
  tier: 1
  tradeValue: 1
  flavor: "A thick candle pressed from reed wax and dried marsh grass. It burns slow and smells like still water after rain."
  effect:
    category: Restoration
    description: |
      Light during a rest. All players taking that rest clear 1 Stress. The candle burns for the duration of the rest and cannot be extinguished and relit.

- name: Bubble Croaker
  type: The Croak
  usage: Consumable
  tier: 1
  tradeValue: 1
  flavor: "A thumb-sized frog that sits perfectly still until it doesn't. Then it fills its throat sac until the bubble is taller than a person and keeps going."
  effect:
    category: Utility
    description: |
      Release the frog. It inflates a bubble large enough to hold up to 3 creatures, then the bubble lifts free and the frog is gone.

      The bubble floats steadily upward by default. Passengers can push off nearby surfaces or use tools to steer, but the bubble's natural direction is up.

      The bubble persists until it contacts a sharp surface, takes damage from a weapon or attack, or the scene ends. Creatures inside cannot take actions that would puncture the bubble without destroying it.

- name: Blood Frog Totem
  type: The Croak
  usage: Consumable
  tier: 2
  tradeValue: 2
  flavor: "A squat clay frog packed with something that isn't clay. It squats where you leave it and watches the mist come in."
  effect:
    category: Protection
    description: |
      Place the totem at any location within reach. It stays there.

      While within Close range of the totem, whenever you would gain 1 Mist token, any player in Close range may instead take 1 damage. The totem marks 1 charge.

      After 5 charges the totem croaks once — loud, final — and splatters. It is destroyed.

- name: Stress Leeches
  type: The Croak
  usage: Consumable
  tier: 1
  tradeValue: 1
  flavor: "A damp pouch of swamp leeches, kept alive. The Croak sells them with the same expression they sell everything else."
  effect:
    category: Restoration
    description: |
      Apply during a rest. Before applying, choose how many leeches to use (1 to 3). Clear that many Stress. Lose 1 HP for each Stress cleared.

      The exchange is fixed — you choose the amount before the leeches are applied.

# ============================================================
# 🎩 TIM ITEMS
# ============================================================

- name: Thumbs-Up Guy
  type: Tim
  usage: Reusable
  tier: 1
  tradeValue: 1.5
  flavor: "A palm-sized wooden figure, thumb permanently raised, grinning like it already knows how this goes."
  effect:
    category: Restoration
    description: |
      Give the little wooden figure a thumbs up back. Once per Long Rest, gain 1 Hope.

- name: Miniature Wagon
  type: Tim
  usage: Consumable
  tier: 2
  tradeValue: 4
  flavor: "A tiny carved cart, complete with a tiny carved donkey mid-flap. Something about it feels less like a toy and more like an address."
  effect:
    category: Utility
    description: |
      Speak Tim's name and set the miniature down. It splinters apart the moment it's used — eventually, on his schedule and nobody else's, his cart descends from the mist and offers a ride anywhere on the current Path. Cannot carry a Sacred Flame or Flame Essence; his cart isn't built for it, and he's not about to start being careful now.

- name: This-Way Guy
  type: Tim
  usage: Consumable
  tier: 1
  tradeValue: 0.5
  flavor: "A small figure in a felt cloak, one arm permanently outstretched, pointing at something only it can see."
  effect:
    category: Utility
    description: |
      Snap it in half to reroll a roll that determines where you end up — a Mushroom Circle facing roll, an Off-Path consequence roll, or similar — and take the new result.

- name: Shrug Guy
  type: Tim
  usage: Reusable
  tier: 1
  tradeValue: 0.5
  flavor: "A tiny wooden figure with its shoulders carved permanently at their apex. It has never once had an opinion."
  effect:
    category: Utility
    description: |
      No mechanical effect. Pick it up, it shrugs. That's all it's ever done.

- name: Reaction Boards
  type: Tim
  usage: Reusable
  tier: 1
  tradeValue: 0.5
  flavor: "A set of small wooden placards, each carved into a single unmistakable expression. Tim insists they're 'very useful.'"
  effect:
    category: Utility
    description: |
      No mechanical effect. Hold one up during a dramatic moment for the reaction it deserves.

- name: The Bobblehead Wizard
  type: Tim
  usage: Reusable
  tier: 1
  tradeValue: 1
  flavor: "A small carved likeness of Tim himself, head balanced on a spring far too enthusiastic for its own good."
  effect:
    category: Utility
    description: |
      No mechanical effect. Wobbles happily at the slightest vibration — a footstep, a sneeze, a nearby structural collapse — with identical enthusiasm regardless of circumstances.

- name: Woody
  type: Tim
  usage: Reusable
  tier: 1
  tradeValue: 1
  flavor: "A stiff-legged little figure, wound tight and ready to march. Its carved eyes seem to track you when you're not looking directly at them."
  effect:
    category: Utility
    description: |
      Wind Woody up and set him down facing a direction. He walks in a straight line until he hits something or tips over. Good for distracting a single enemy or triggering something from a distance without you being there.

      Rarely — GM's call, sparingly — he wanders off-script entirely.

# ============================================================
# CUSTOM ITEMS (player-created)
# ============================================================
# Items created for individual players' characters — not tied to a
# faction's Item Identity.

- name: Bambi-bal-lecter
  type: Custom
  usage: Reusable
  tier: 2
  tradeValue: not tradeable — a bonded nature spirit, not merchandise
  flavor: "By every appearance, an ordinary stag out of Blood Fern Valley — until it isn't there, and then it is."
  effect:
    category: Disruption
    description: |
      Bambi-bal-lecter looks like an ordinary stag. She isn't — a nature spirit wearing a stag's shape, which is how she manages to appear out of nowhere at your call, run down a target, and fade back into the trees.

      Attack using Presence. On a hit, roll a number of d10s equal to your Proficiency and add the modifier of the Experience you invoke for the attack.

      - Summon: Spend 1 Hope to have Bambi-bal-lecter attack a target within Very Far range.
      - Delightful: Roll a d6 after the attack resolves. On a 6, a player within Close range gains 1 Hope.
      - Forceful: On a successful hit, push the target Close range in a direction of your choice.
