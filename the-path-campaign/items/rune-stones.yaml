title: Rune Stones
version: 1

introduction: |
  Runes are carved through a blood ritual. Big runes are fixed ritual sites. Small runes are carried items, made as preparation for travelling into the mist. This file covers how small runes are charged and what each one does.

charging:
  description: |
    Each small rune has a passive effect that works while it is carried, and an active effect that spends charges.

    A rune stone is inert in the hands of someone who does not understand it. A character can only charge a rune stone or use its passive and active once they know its rune fully — all three levels, uncovered through the Wandering Stars (see the Readings page). Knowing the rune is also how they learn its charge condition.

    Charging is a ritual. Every 3 HP marked by a living creature present at the ritual adds 1 charge to the rune. The blood does not have to be given willingly — a PC can pay it, or a captured creature can be bled for it. Blood spilled in a fight does not count, and the blood of mist creatures does not take. Each rune also names a condition that must be met for the ritual to work — see the rune's own entry.

    There is no limit on how often a rune can be charged. The HP cost is the limit.
  costPerCharge: 3 HP
  maxCharges: 7

smallRunes:
  - name: Finding
    rune: Kenaz
    glyph: ᚲ
    status: done
    summary: Reveal what waits on the Path ahead.
    stone: One lies with a long-dead traveler on Level 2 of Sporerain Bridge, holding 1 charge.
    chargeCondition: The ritual must be performed under an open sky. The GM decides where the sky is open above the mist.
    passive: |
      The holder can read runes in the sky. When they make a Wandering Stars reading, the GM also reveals the runes that stand among the stars that night.
    description: |
      **Reveal a location:** While under an open sky, the holder can spend 1 charge to turn one face-down location card on the current Path face-up. The players learn which location it is before anyone travels there.

  - name: Travel
    rune: Raidho
    glyph: ᚱ
    status: done
    summary: Step into the mist between locations on the current Path without getting lost.
    stone: One is held by the Archon of Mercy (see the Meteorite Lab).
    chargeCondition: The ritual must be performed on a Stable location.
    passive: |
      If the Path ends while the party is on an Unstable location, the holder draws 2 location cards for each off-Path step instead of 1 and chooses which one the party moves to. The other card goes back into the deck.
    description: |
      The holder can lead characters through an empty grid cell — a cell with no location on the current Path — to the location on its far side.

      Each character crossing one empty cell spends 1 charge and gains 3 Mist tokens. A character can cross several empty cells in a row, spending 1 charge and gaining 3 Mist tokens for each.

      The destination must be a location on the current Path.

  - name: Inheritance
    rune: Othala
    glyph: ᛟ
    status: done
    summary: Claim a location so the mist cannot take it.
    stone: One still sits in its slot at the Iron Altar in the Eisenwald, holding 2 charges.
    chargeCondition: Each charge also requires giving up goods worth 1 Trade Point (see Crafting & Trading). The goods are consumed by the ritual.
    passive: |
      While in a location made Stable by this rune, the holder can choose to gain 1 fewer Mist token whenever they would gain Mist tokens.
    description: |
      The holder can spend 3 charges to make the location they are in Stable. The claim survives the next 2 Path resets: the location keeps its grid position when each new Path is laid out. After the second reset it is Unstable again, and the next reset removes it like any other Unstable location.

      There is no limit on how many locations can be claimed this way. The same location can only be claimed once per Path — claiming it again on a later Path restarts its count at 2.

  - name: Fate
    rune: Perthro
    glyph: ᛈ
    status: done
    summary: Rewrite what a character is.
    stone: The Ancestor's Fate stone was taken from the Iron Altar in the Eisenwald. Whereabouts open.
    chargeCondition: The blood must be taken unwillingly. A PC's own blood does not take.
    passive: |
      Fate pulls harder on the holder's rolls. When the holder rolls with Hope, they gain 1 additional Hope. When they roll with Fear, the GM gains 1 additional Fear. On a critical success, they gain 1 additional Hope.
    description: |
      The holder can spend all 7 charges to rewrite one character's fate. That character may change their ancestry and their community, and adapt their class.

  - name: Regeneration
    rune: Eihwaz
    glyph: ᛇ
    status: done
    summary: Return from what should have killed you.
    stone: Whereabouts open.
    chargeCondition: The ritual must be performed directly after a fight, before anyone rests.
    passive: |
      When the holder rests, they clear 1 additional Hit Point.
    description: |
      When the holder marks their last Hit Point, or gains the Mist token that would consume them, they can spend 3 charges in response:

      - **Against death:** they clear 1 Hit Point right after marking the last one. They are left with 1 Hit Point, stay standing, and make no death move.
      - **Against the mist:** they lose Mist tokens until they are one below the number that would consume them.

  - name: Harvest
    rune: Jera
    glyph: ᛃ
    status: done
    summary: Life to life. Growing nature's gifts.
    stone: None. It has to be created at the Rune Forge in Hibernia.
    location: Carved above the grow beds in the Ancestor's tower in Hibernia.
    chargeCondition: The holder must have grown a plant themselves, from a seed or a cutting, and cared for it. In the ritual, the blood is poured onto its roots. It must still be alive. What counts is up to the GM, but it should have been part of play.
    passive: |
      When the holder rolls to find out how much they harvest or gather, they can reroll. They must take the new result.
    description: |
      The holder can spend charges to turn them into goods. Each charge spent becomes goods worth **0.25 Trade Points**.

  - name: Light
    rune: Sowilo
    glyph: ᛊ
    status: done
    summary: Burn the mist away.
    stone: None. It has to be created at the Rune Forge in Hibernia.
    location: Carved above the hot pool at the Black Shore in Hibernia.
    chargeCondition: The holder must be clean. They cannot have any Mist tokens when the ritual is performed.
    passive: |
      Once per rest, when an ally within Close range would gain Mist tokens, they gain 1 fewer.
    description: |
      The holder can spend 1 charge to remove **2 Mist tokens** from themselves or from a character they touch.

bigRunes:
  - name: Godhood
    rune: Ansuz
    glyph: ᚨ
    status: open
    summary: The rune of ascension.
    location: The Iron Altar at the center of the Eisenwald — a forest that turned to iron when the ritual was performed. Godhood is carved into one of the altar's seven standing stones. See the Eisenwald location.
    carried: Carved on the body of the one who ascends.
    chargeCondition: In the ritual, Godhood is represented by the one who ascends. The rune is carved into their body, which costs them 7 max HP, permanently.

  - name: Sacrifice
    rune: Fehu
    glyph: ᚠ
    status: open
    summary: The rune of the offering.
    location: |
      The blood stone beneath the Great Mangrove in The Reeds. The stone is the rune itself, made from the blood of the many killed on it. Its grooves still hold that blood.

      The stone is a well. Once per day, a rune stone laid in the grooves gains 1 charge without anyone marking HP — the blood in the stone pays for it. This ignores the rune's own charge condition.
    carried: The stone stays where it is. Fehu is also carved into one of the Iron Altar's standing stones.
    chargeCondition: In the ritual, Sacrifice is represented by seven willing people, each bearing the rune on their body. The ritual does not kill them. It takes what they are.

  - name: Humanity
    rune: Mannaz
    glyph: ᛗ
    status: open
    summary: The rune of the self — the identity of the god.
    location: TBD. Mannaz is also carved into one of the Iron Altar's standing stones.
    carried: Carved on the body of the one who ascends.
    chargeCondition: TBD. In the ritual, Humanity binds the other runes together, and their combination sets the god's domain. What represents it is TBD.

ascension:
  description: |
    The ascension ritual makes a minor god. It takes place at the Iron Altar in the Eisenwald and needs the power of seven runes, enclosed in the altar's seven standing stones — 49 charges in total.

    Three standing stones have the big runes carved into them: Godhood (Ansuz), Sacrifice (Fehu) and Humanity (Mannaz). They are not charged with rune stones. Each needs something in the ritual to represent it (see each big rune's charge condition).

    The other four standing stones each have a slot for a small rune stone with all 7 charges. One must be Fate (Perthro). The other three can be any rune. A partly charged stone does not count, and the ritual cannot begin until all four slots are filled.

    When the ritual begins, it triggers the Apotheosis event (TBD). Afterwards, each slotted rune stone has 2 charges left and can be taken out again.
  outcome: |
    The one who ascends becomes a minor god. The GM sets the god's domain from the combination of runes that filled the ritual — Humanity is what binds them into one identity. The ascension also changes the land around the altar in a way that fits that domain. For the Ancestor, the GM decides which runes he used; the Eisenwald turning to iron is a clue to his domain.
