<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event - The Path</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .trigger-block {
            background: rgba(106, 76, 147, 0.12);
            border-left: 0.2rem solid #6a4c93;
            border-radius: 0.15rem;
            padding: 0.6rem 0.8rem;
            margin: 0.75rem 0;
            font-size: 0.9rem;
        }

        .block-label {
            display: block;
            color: var(--accent-amber);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.3rem;
        }

        .tier-toggle {
            display: flex;
            gap: 0.4rem;
            margin: 0.75rem 0;
        }

        .tier-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-light);
            border: 0.15rem solid var(--border-color);
            border-radius: 0.2rem;
            padding: 0.35rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .tier-btn:hover { background: rgba(255, 255, 255, 0.12); }
        .tier-btn.active {
            background: rgba(200, 121, 65, 0.25);
            border-color: var(--accent-amber);
            color: var(--accent-amber);
        }
    </style>
</head>
<body>
    <a class="home-btn" href="index.html">&#8962; Home</a>
    <div class="container">
        <header>
            <nav class="breadcrumb"><a href="events.html">← Back to Events</a></nav>
        </header>

        <main id="event-content">
            <div class="loading"><p>Loading event...</p></div>
        </main>

        <footer><p>The Path - Daggerheart Campaign Frame</p></footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="js/content-index.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/event.js"></script>
</body>
</html>
